<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gallery – Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
body {
  background: #0a0a0a;
  color: #f5f5f5;
  font-family: "Inter", sans-serif;
  padding: 3rem 5%;
  margin: 0;
}

h1 {
  font-family: "Libre Baskerville", serif;
  font-size: 2.6rem;
  margin-bottom: 1rem;
}

p {
  color: #bbb;
  margin-bottom: 3rem;
  max-width: 650px;
  line-height: 1.6;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.5rem;
}

.item {
  position: relative;
  overflow: hidden;
  border-radius: 4px;
  cursor: pointer;
  background: #000;
  aspect-ratio: 3/4;
}

.item img,
.item video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: grayscale(1);
  transition: 0.4s ease;
}

.item:hover img,
.item:hover video {
  filter: grayscale(0);
  transform: scale(1.05);
}

/* Play icon overlay */
.play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 60px;
  background: rgba(212, 175, 55, 0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: #0a0a0a;
  pointer-events: none;
  transition: 0.3s ease;
  padding-left: 4px;
}

.item:hover .play-icon {
  background: rgba(212, 175, 55, 1);
  transform: translate(-50%, -50%) scale(1.1);
}

.item-title {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
  color: #fff;
  padding: 2rem 1rem 1rem;
  font-size: 0.95rem;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.item:hover .item-title {
  opacity: 1;
}

/* Modal viewer */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.9);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  z-index: 2000;
}

.modal img,
.modal video {
  max-width: 90vw;
  max-height: 85vh;
  border-radius: 6px;
}

.modal-close {
  position: fixed;
  top: 20px;
  right: 30px;
  font-size: 2.5rem;
  color: #fff;
  cursor: pointer;
  font-family: sans-serif;
  transition: color 0.3s;
  z-index: 2001;
}

.modal-close:hover {
  color: #d4af37;
}

/* Back button */
.back-btn {
  display: inline-block;
  margin-bottom: 2rem;
  color: #d4af37;
  text-decoration: none;
  font-size: 0.95rem;
  transition: opacity 0.3s;
}

.back-btn:hover {
  opacity: 0.7;
}

/* Responsive */
@media (max-width: 768px) {
  body {
    padding: 2rem 5%;
  }
  
  h1 {
    font-size: 2rem;
  }
  
  .gallery {
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
  }
  
  .play-icon {
    width: 50px;
    height: 50px;
    font-size: 20px;
  }
}
</style>
</head>
<body>

<a href="index.html" class="back-btn">← Back to Portfolio</a>

<h1>Film & Documentary</h1>
<p>Narrative & documentary work exploring stories that matter — from activism to human connection.</p>

<div class="gallery">
  <!-- Example image item -->
  <div class="item" onclick="openModal(this)">
    <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=800" alt="Film Project">
    <div class="item-title">Sample Film Project</div>
  </div>

  <!-- Example video item -->
  <div class="item" onclick="openModal(this)">
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" muted></video>
    <div class="play-icon">▶</div>
    <div class="item-title">Sample Video</div>
  </div>

  <!-- Graduate Student Employees Union (GSEU) -->
  <div class="item" onclick="openInstagram('https://www.instagram.com/reel/CousF0DAtcJ/')">
    <img src="images/gseu.png" alt="GSEU Video">
    <div class="play-icon">▶</div>
    <div class="item-title">Graduate Student Employees Union (GSEU)</div>
  </div>

  <!-- Add more items here -->
  <div class="item" onclick="openInstagram('https://www.instagram.com/reel/YOUR_REEL_ID/')">
    <img src="https://images.unsplash.com/photo-1579548122080-c35fd6820ecb?w=800" alt="Another Project">
    <div class="play-icon">▶</div>
    <div class="item-title">Another Film Project</div>
  </div>

  <div class="item" onclick="openModal(this)">
    <video src="https://www.w3schools.com/html/movie.mp4" muted></video>
    <div class="play-icon">▶</div>
    <div class="item-title">Documentary Clip</div>
  </div>

  <div class="item" onclick="openModal(this)">
    <img src="https://images.unsplash.com/photo-1492619375914-88005aa9e8fb?w=800" alt="Documentary Still">
    <div class="item-title">Documentary Still</div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal" onclick="checkModalClick(event)">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <div id="modal-content"></div>
</div>

<script>
function openModal(el) {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modal-content");
  let media = el.querySelector("img")?.cloneNode() ||
               el.querySelector("video")?.cloneNode();
  
  if (media.tagName === "VIDEO") {
    media.controls = true;
    media.autoplay = true;
    media.muted = false;
  }
  
  content.innerHTML = "";
  content.appendChild(media);
  modal.style.display = "flex";
}

function openInstagram(url) {
  window.open(url, '_blank');
}

function closeModal() {
  const modal = document.getElementById("modal");
  const video = modal.querySelector("video");
  
  if (video) {
    video.pause();
    video.currentTime = 0;
  }
  
  modal.style.display = "none";
  document.getElementById("modal-content").innerHTML = "";
}

function checkModalClick(e) {
  const modal = document.getElementById("modal");
  
  if (e.target === modal) {
    closeModal();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    closeModal();
  }
});
</script>

</body>
</html>
