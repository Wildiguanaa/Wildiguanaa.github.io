<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gallery – TITLE HERE</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  body {
    background: #0a0a0a;
    color: #f5f5f5;
    font-family: "Inter", sans-serif;
    padding: 3rem 5%;
  }

  h1 {
    font-family: "Libre Baskerville", serif;
    font-size: 2.6rem;
    margin-bottom: 1rem;
  }

  p {
    color: #bbb;
    margin-bottom: 3rem;
    max-width: 650px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.5rem;
  }

  .item {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    cursor: pointer;
    background: #000;
  }

  .item img,
  .item video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(1);
    transition: 0.4s ease;
  }

  .item:hover img,
  .item:hover video {
    filter: grayscale(0);
    transform: scale(1.05);
  }

  .item-title {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(0,0,0,0.5);
    color: #fff;
    padding: 0.6rem 0.8rem;
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .item:hover .item-title {
    opacity: 1;
  }

  /* Modal viewer */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    z-index: 2000;
  }

  .modal img,
  .modal video {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 6px;
  }

  .modal-close {
    position: fixed;
    top: 20px;
    right: 30px;
    font-size: 2rem;
    color: #fff;
    cursor: pointer;
    font-family: sans-serif;
  }
</style>
</head>

<body>

<h1>TITLE HERE</h1>
<p>DESCRIPTION GOES HERE — what this category represents, your approach, etc.</p>

<div class="gallery">

  <!-- Example image item -->
  <div class="item" onclick="openModal(this)">
    <img src="YOUR_IMAGE.jpg" alt="Sample">
    <div class="item-title">Project Title</div>
  </div>

  <!-- Example video item -->
  <div class="item" onclick="openModal(this)">
    <video src="YOUR_VIDEO.mp4" muted></video>
    <div class="item-title">Video Title</div>
  </div>

</div>

<!-- Modal -->
<div class="modal" id="modal">
  <span class="modal-close" onclick="closeModal()">&times;</span>
  <div id="modal-content"></div>
</div>

<script>
function openModal(el) {
  const modal = document.getElementById("modal");
  const content = document.getElementById("modal-content");

  let media = el.querySelector("img")?.cloneNode() ||
              el.querySelector("video")?.cloneNode();

  if (media.tagName === "VIDEO") {
    media.controls = true;
    media.autoplay = true;
  }

  content.innerHTML = "";
  content.appendChild(media);
  modal.style.display = "flex";
}

function closeModal() {
  const modal = document.getElementById("modal");
  modal.style.display = "none";
  document.getElementById("modal-content").innerHTML = "";
}

window.onclick = function(e) {
  const modal = document.getElementById("modal");
  if (e.target === modal) closeModal();
}
</script>

</body>
</html>
