<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Joanna Fishman</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #040717;
      --bg-card-dark: #151d3d;
      --text-primary-dark: #e8e6f0;
      --text-muted-dark: #9ba3b8;
      --accent: #501E28;
      --accent-glow: rgba(80, 30, 40, 0.3);
      --accent-light: #6b2a39;
      
      --font-serif: "Libre Baskerville", serif;
      --font-sans: "Inter", sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background: var(--bg-dark);
      color: var(--text-primary-dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-container {
      background: var(--bg-card-dark);
      border: 1px solid rgba(232, 230, 240, 0.1);
      border-radius: 8px;
      padding: 3rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header h1 {
      font-family: var(--font-serif);
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary-dark);
    }

    .login-header p {
      color: var(--text-muted-dark);
      font-size: 0.95rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-muted-dark);
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 0.9rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(232, 230, 240, 0.15);
      border-radius: 4px;
      color: var(--text-primary-dark);
      font-family: var(--font-sans);
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-light);
      background: rgba(255, 255, 255, 0.08);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--text-muted-dark);
    }

    .remember-me input {
      width: auto;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #f5e8e0;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 1rem;
    }

    .login-btn:hover {
      background: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    .signup-link {
      text-align: center;
      color: var(--text-muted-dark);
      font-size: 0.9rem;
    }

    .signup-link a {
      color: var(--accent-light);
      text-decoration: none;
      transition: color 0.3s;
    }

    .signup-link a:hover {
      color: var(--accent);
    }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: var(--accent-light);
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>

<div class="login-container">
  <a href="index.html" class="back-link">← Back to Portfolio</a>
  
  <div class="login-header">
    <h1>Welcome Back!</h1>
    <p>Access your photos and videos</p>by logging in below.</p>
  </div>

  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="email">Email *</label>
      <input type="email" id="email" required placeholder="" />
    </div>

    <div class="form-group">
      <label for="password">Password *</label>
      <input type="password" id="password" required placeholder="" />
    </div>

    <div class="remember-me">
      <input type="checkbox" id="remember" />
      <label for="remember" style="margin: 0;">Remember me</label>
    </div>

    <button type="submit" class="login-btn">Sign In</button>
  </form>

  <div class="signup-link">
    Don't have an account? <a href="mailto:team@jdnydigital.com">Contact me to join!</a>
    </div>
</div>

<script>
  function handleLogin(event) {
    event.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    
    // Store login info (in real app, this would authenticate against a server)
    localStorage.setItem('userEmail', email);
    localStorage.setItem('isLoggedIn', 'true');
    
    alert('Login successful! Redirecting to your gallery...');
    window.location.href = 'gallery.html';
  }
</script>

</body>
</html>
